name: preflight-rails-react

# The dependency manifests and dependency-installing Dockerfiles are byte-identical
# copies of the assessment's. The tooling, Playwright, and extractor services only
# warm those image layers, then exit successfully.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: preflight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d preflight"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: { context: backend, dockerfile: Dockerfile.dev }
    command: bin/rails db:migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/preflight
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: backend, dockerfile: Dockerfile.dev }
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/preflight
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/up >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "${API_PORT:-3100}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3000
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api: { condition: service_healthy }

  tooling:
    build: { context: ., dockerfile: Dockerfile.check }
    command: ruby --version

  playwright:
    build: { context: e2e }
    command: npx playwright --version

  extractor:
    build: ./scripts
    command: ["extract_claude_session_log.py", "--help"]

volumes:
  postgres-data:
  frontend-node-modules:
